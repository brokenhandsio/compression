name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.11
    with:
      linux_swift_versions: '["6.3", "6.4", "nightly-main"]'
      linux_build_command: "swift test --explicit-target-dependency-import-check error"
      linux_pre_build_command: "./scripts/fetch-silesia.sh Tests/Fixtures/Silesia"
      enable_linux_static_sdk_build: true
      linux_static_sdk_versions: '["6.3", "6.4"]'
      enable_wasm_sdk_build: true
      wasm_sdk_versions: '["6.3", "6.4"]'
      windows_swift_versions: '["6.3", "6.4"]'
      enable_android_sdk_build: true
      android_sdk_versions: '["6.4"]'
      enable_macos_checks: false
      enable_ios_checks: false
      enable_freebsd_checks: true
      enable_embedded_wasm_sdk_build: true
      windows_build_timeout: 30

  darwin:
    name: Darwin (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { xcode: "26.6", runner: macos-26 }
          - { xcode: "27.0", runner: xcode-27 }
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/fetch-silesia.sh Tests/Fixtures/Silesia
      - name: macOS tests
        run: swift test
      - name: iOS build
        run: swift build --build-tests --sdk "$(xcrun --sdk iphoneos --show-sdk-path)" --triple arm64-apple-ios
